name: CI

on:
  push:
    branches: [main]
  pull_request:
  # publish.yml が gate として再利用する (CI green でない commit から publish させない)
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # justfile の lint recipe が `just --fmt --check --unstable` を含むため、
      # recipe を叩く just 自身が runner に要る。
      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # justfile の ci recipe = lint → typecheck → test → build。
      # 依存の重複排除で各段が 1 回ずつしか走らないので、ローカルと同じ 1 コマンドにする。
      - name: CI (lint + typecheck + test + build)
        run: just ci

      # server はどの runtime でも WebCrypto だけで動くことを約束しているので、
      # build 済みの dist を 3 runtime で 1 往復ずつ検証する。
      # smoke.mjs は test helper の .ts を import するため node は型除去対応版 (>= 22.18) が要る。
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Smoke (node)
        run: node packages/server/test/runtime/smoke.mjs
      - name: Smoke (bun)
        run: bun packages/server/test/runtime/smoke.mjs
      - name: Smoke (deno)
        run: deno run packages/server/test/runtime/smoke.mjs
